<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Plaintext browser smoke test</title></head>
<body data-status="running">
<pre id="result">running</pre>
<script>
const result = document.querySelector("#result");
const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
const HOUR = 3_600_000;

function assert(condition, message) {
  if (!condition) throw new Error(message);
}

async function until(check, message, timeout = 8000) {
  const deadline = Date.now() + timeout;
  while (Date.now() < deadline) {
    if (await check()) return;
    await wait(50);
  }
  throw new Error(message);
}

function deleteDatabase(name) {
  return new Promise((resolve, reject) => {
    const request = indexedDB.deleteDatabase(name);
    request.onsuccess = () => resolve();
    request.onerror = () => reject(request.error);
    request.onblocked = () => reject(new Error("database deletion blocked"));
  });
}

async function writeFile(directory, name, text) {
  const writable = await (await directory.getFileHandle(name, { create: true })).createWritable();
  await writable.write(text);
  await writable.close();
}

const readFile = async (directory, name) => (await (await directory.getFileHandle(name)).getFile()).text();

async function historyTexts(folder) {
  const texts = [];
  for await (const [name, handle] of (await folder.getDirectoryHandle("history")).entries()) {
    texts.push({ name, text: await (await handle.getFile()).text() });
  }
  return texts;
}

const frame = document.createElement("iframe");
const frameWin = () => frame.contentWindow;
const frameDoc = () => frame.contentDocument;
const editor = () => frameDoc().querySelector("#editor");
const status = () => frameDoc().querySelector("#persistenceStatus");

async function loadApp() {
  const loaded = new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
  if (frame.isConnected) frameWin().location.reload();
  else {
    frame.src = "../index.html";
    document.body.append(frame);
  }
  await loaded;
  await until(() => editor() && !editor().disabled, "editor never became editable");
}

function type(value) {
  editor().value = value;
  editor().dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText", data: value.slice(-1) }));
}

function firstPaletteCommand() {
  frameDoc().querySelector("#title").click();
  const command = frameDoc().querySelector("#paletteList button");
  return command;
}

async function run() {
  await deleteDatabase("plaintext");
  localStorage.clear();
  const now = Date.now();
  localStorage.setItem("plaintext.recovery", "legacy text");
  localStorage.setItem("plaintext.documentName", "notes.md");
  localStorage.setItem("plaintext.history", JSON.stringify([{ date: now - 3 * HOUR, text: "older legacy" }]));

  const opfs = await navigator.storage.getDirectory();
  await opfs.removeEntry("Plaintext", { recursive: true }).catch(() => {});
  const folder = await opfs.getDirectoryHandle("Plaintext", { create: true });
  await writeFile(folder, "document.md", "disk text");
  const nested = await (await (await folder.getDirectoryHandle("Plaintext", { create: true }))
    .getDirectoryHandle("recovery", { create: true })).getDirectoryHandle("snapshots", { create: true });
  await writeFile(nested, "1-r1.json", JSON.stringify({ format: "plaintext-web", version: 1, name: "notes.md",
    savedAt: now - 48 * HOUR, revision: 1, parentDigest: null, digest: "a".repeat(64), text: "from nested snapshot" }));

  result.textContent = "migration";
  await loadApp();
  assert(editor().value === "legacy text", "localStorage text was not migrated");
  type("legacy text, now edited");
  await until(() => /safety-copy folder/.test(status().textContent), "no nudge to choose a safety-copy folder");

  result.textContent = "connect";
  frameWin().showDirectoryPicker = async () => folder;
  firstPaletteCommand().click();
  await until(async () => await readFile(folder, "document.md") === "legacy text, now edited",
    "the newer browser text did not reach document.md");
  let history = await historyTexts(folder);
  assert(history.some((entry) => entry.text === "disk text" && entry.name.endsWith(".pinned.md")),
    "the older disk text was not kept as a pinned version");
  assert(history.some((entry) => entry.text === "from nested snapshot"), "nested legacy snapshots were not imported");
  assert(history.some((entry) => entry.text === "older legacy"), "localStorage history was not migrated");
  assert(status().hidden, "status line stayed visible with a healthy safety copy");

  result.textContent = "outside edit";
  await writeFile(folder, "document.md", "edited elsewhere");
  type("typed after the outside edit");
  await until(async () => await readFile(folder, "document.md") === "typed after the outside edit",
    "typing did not reach document.md");
  history = await historyTexts(folder);
  assert(history.some((entry) => entry.text === "edited elsewhere" && entry.name.endsWith(".pinned.md")),
    "an outside edit to document.md was overwritten without being kept");

  result.textContent = "reload";
  await loadApp();
  await until(() => /change folder/.test(firstPaletteCommand().textContent), "remembered folder did not resume");
  frameDoc().querySelector("#palette").close();

  result.textContent = "wipe and restore";
  frame.remove();
  await deleteDatabase("plaintext");
  localStorage.clear();
  await loadApp();
  assert(editor().value === "", "wiped browser still had text");
  frameWin().showDirectoryPicker = async () => folder;
  const restore = firstPaletteCommand();
  assert(/Restore from safety copy/.test(restore.textContent), "empty Plaintext did not offer restore");
  restore.click();
  await until(() => editor().value === "typed after the outside edit", "wiped browser was not restored from document.md");
  await until(async () => {
    const db = await new Promise((resolve, reject) => {
      const open = indexedDB.open("plaintext");
      open.onsuccess = () => resolve(open.result);
      open.onerror = () => reject(open.error);
    });
    const versions = await new Promise((resolve) => {
      const request = db.transaction("versions").objectStore("versions").getAll();
      request.onsuccess = () => resolve(request.result);
    });
    db.close();
    return versions.some((version) => version.text === "edited elsewhere");
  }, "history was not restored from the safety copy");

  document.body.dataset.status = "pass";
  result.textContent = "safety copy migrates, keeps every differing text, and restores a wiped browser";
}

run().catch((error) => {
  document.body.dataset.status = "fail";
  result.textContent = (result.textContent || "") + ": " + (error && error.stack || error);
});
</script>
</body>
</html>
